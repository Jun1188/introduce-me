name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_content.py && node --check app.js
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Check real browser layouts and interaction
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          python tests/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-review
          path: test-results/
